name: CI

on:
  push:
    branches: [ main, '01-*', 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Run Swift Package Tests
        run: swift test

      - name: Run Format Lint Check
        run: swift format lint --recursive Sources Tests KerNotch

      - name: Run Core Architecture Guard
        run: ./scripts/check-core-dependencies.sh

      - name: Run Translation Guard
        run: ./scripts/check-translations.sh
      - name: Run Asset Guard
        run: ./scripts/check-assets.sh

      - name: Build Release Configuration
        run: xcodebuild -scheme KerNotch -configuration Release -destination "platform=macOS" build

      - name: Assert Music Backend Matches Platform
        run: ./scripts/check-music-backend.sh

      - name: Assert MediaRemote Backend Is Linked
        run: |
          RELEASE_BIN=$(find ~/Library/Developer/Xcode/DerivedData -name "KerNotch" -path "*/Release/KerNotch.app/Contents/MacOS/*" -type f | head -n 1)
          if [ -n "$RELEASE_BIN" ]; then
            ./scripts/check-media-remote-linked.sh "$RELEASE_BIN"
          else
            echo "Error: Release binary not found"
            exit 1
          fi
