name: CI

on:
  push:
    branches: [ main, '01-*', 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Swift Package Tests
        run: swift test

      - name: Run Format Lint Check
        run: swift format lint --recursive Sources Tests NotchFlow

      - name: Run Core Architecture Guard
        run: ./scripts/check-core-dependencies.sh

      - name: Run Translation Guard
        run: ./scripts/check-translations.sh
      - name: Run Asset Guard
        run: ./scripts/check-assets.sh

      - name: Build App Store Configuration
        run: xcodebuild -scheme "NotchFlow (App Store)" -destination "platform=macOS" build

      - name: Build Direct Configuration
        run: xcodebuild -scheme "NotchFlow (Direct)" -destination "platform=macOS" build

      - name: Assert Music Backend Differs Per Configuration
        run: ./scripts/check-music-backend.sh

      - name: Run Forbidden Symbol Guard on App Store Binary
        run: |
          APPSTORE_BIN=$(find ~/Library/Developer/Xcode/DerivedData -name "NotchFlow" -path "*/AppStore/*" -type f | head -n 1)
          if [ -n "$APPSTORE_BIN" ]; then
            ./scripts/check-forbidden-symbols.sh "$APPSTORE_BIN"
          else
            echo "Error: AppStore binary not found"
            exit 1
          fi
